name: smartfab_industries
description: Material Tracking & Costing App for SmartFab Industries
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0
  cloud_firestore: ^4.9.1
  firebase_storage: ^11.2.6
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  shared_preferences: ^2.2.1
  
  # UI Components
  flutter_barcode_scanner: ^2.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.10.4
  path_provider: ^2.1.1
  intl: ^0.18.1
  google_fonts: ^6.1.0
  
  # Networking
  connectivity_plus: ^4.0.2
  http: ^1.1.0
  
  # Utilities
  uuid: ^3.0.7
  permission_handler: ^10.4.5
  logger: ^1.4.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/ 